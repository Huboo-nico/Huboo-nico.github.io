  <script>
    /* Polyfill setter for fetch so Chrome extensions can monkey-patch window.fetch without throwing */
    (function() {
      try {
        let _fetch = window.fetch;
        Object.defineProperty(window, 'fetch', {
          get() {
            return _fetch;
          },
          set(newFetch) {
            _fetch = newFetch;
          },
          configurable: true,
          enumerable: true,
        });
      } catch (e) {
        try {
          let _pFetch = Window.prototype.fetch;
          Object.defineProperty(Window.prototype, 'fetch', {
            get() {
              return _pFetch;
            },
            set(newFetch) {
              _pFetch = newFetch;
            },
            configurable: true,
            enumerable: true,
          });
        } catch (e2) {}
      }
    })();
  </script>
